<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEAL CLAWFORD - MISSION CONTROL</title>
<style>
  :root { --bg:#0b0e14; --card:#141a23; --ink:#e8eef7; --dim:#8b98ab; --red:#ff4d5e; --amber:#ffb347; --green:#3ddc84; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
  header { padding:28px 20px 12px; text-align:center; border-bottom:2px solid var(--red); }
  h1 { margin:0; font-size:clamp(24px,5vw,42px); letter-spacing:2px; }
  .sub { color:var(--dim); margin-top:6px; }
  #countdown { font-size:clamp(28px,6vw,54px); font-weight:800; color:var(--amber); margin:18px 0 4px; font-variant-numeric:tabular-nums; }
  .wrap { max-width:1000px; margin:0 auto; padding:20px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid #232c3a; border-radius:12px; padding:16px 18px; }
  .card h2 { margin:0 0 4px; font-size:22px; }
  .badge { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:700; background:var(--red); color:#fff; }
  .badge.cal { background:#37445a; }
  .ghost { color:var(--amber); font-variant-numeric:tabular-nums; font-weight:700; }
  table { width:100%; border-collapse:collapse; margin-top:10px; }
  td,th { text-align:left; padding:6px 8px; border-bottom:1px solid #232c3a; font-size:14px; }
  th { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:1px; }
  .stat { font-size:28px; font-weight:800; }
  .ok { color:var(--green); } .warn { color:var(--amber); } .bad { color:var(--red); }
  footer { color:var(--dim); text-align:center; padding:24px; font-size:13px; }
  a { color:var(--amber); }
  .meter { height:14px; background:#232c3a; border-radius:99px; overflow:hidden; margin:8px 0 4px; }
  .meter > div { height:100%; background:linear-gradient(90deg,var(--green),var(--amber),var(--red)); }
</style>
</head>
<body>
<header>
  <h1>SEAL CLAWFORD // MISSION CONTROL</h1>
  <div class="sub">Operation CONFIRM-SATURDAY &middot; live status &middot; we do not go gently</div>
  <div id="countdown">--:--:--</div>
  <div class="sub">until <span id="deadlineLabel"></span></div>
</header>
<div class="wrap">
  <div class="grid" id="targets"></div>
  <div class="card" style="margin-top:16px">
    <h2>Budget tracker <span class="badge cal">cap $100.00</span></h2>
    <div class="meter"><div id="meterfill"></div></div>
    <div><span class="stat warn" id="spent"></span> spent &middot; <span class="stat ok" id="remaining"></span> remaining</div>
    <table id="budgetlines"><tr><th>Item</th><th>Cost</th><th>When</th></tr></table>
  </div>
  <div class="card" style="margin-top:16px">
    <h2>Systems</h2>
    <table id="systems"></table>
  </div>
</div>
<footer>Seal Claw Industries &middot; updated <span id="updated"></span> &middot; <a href="https://sealclawford.github.io/the-boys-confirm/">Wall of Shame</a></footer>
<script>
async function boot(){
  const d = await (await fetch('mission-control-data.json?'+Date.now())).json();
  document.getElementById('deadlineLabel').textContent = d.deadlineLabel;
  document.getElementById('updated').textContent = d.updated;
  const tdiv = document.getElementById('targets');
  for (const t of d.targets){
    const rows = Object.entries(t.channels).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('');
    tdiv.insertAdjacentHTML('beforeend', `<div class="card">
      <h2>${t.name} <span class="badge">${t.calendar.toUpperCase()}</span></h2>
      <div class="sub">${t.city} &middot; ${t.handle}</div>
      <p>${t.status}</p>
      <p>Ghosting for <span class="ghost" data-since="${t.ghostingSince}">...</span></p>
      <p>Calls: ${t.calls.completed} landed &middot; ${t.calls.busy} declined${t.calls.queued?` &middot; ${t.calls.queued} queued`:''}<br>
      <span class="sub">last: ${t.lastCall.at} - ${t.lastCall.result}</span></p>
      <table><tr><th>Channel</th><th>Status</th></tr>${rows}</table>
    </div>`);
  }
  const b = d.budget;
  document.getElementById('spent').textContent = '$'+b.spent.toFixed(2);
  document.getElementById('remaining').textContent = '$'+b.remaining.toFixed(2);
  document.getElementById('meterfill').style.width = Math.min(100, b.spent/b.cap*100)+'%';
  const bl = document.getElementById('budgetlines');
  for (const l of b.lines) bl.insertAdjacentHTML('beforeend', `<tr><td>${l.item}</td><td>$${l.cost.toFixed(2)}</td><td>${l.when}</td></tr>`);
  const sys = document.getElementById('systems');
  for (const [k,v] of Object.entries(d.systems)) sys.insertAdjacentHTML('beforeend', `<tr><td>${k}</td><td>${v}</td></tr>`);
  const deadline = new Date(d.deadline).getTime();
  const tick = () => {
    const s = Math.max(0, (deadline - Date.now())/1000);
    const dd = Math.floor(s/86400), hh = Math.floor(s%86400/3600), mm = Math.floor(s%3600/60), ss = Math.floor(s%60);
    document.getElementById('countdown').textContent = `${dd}d ${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
    document.querySelectorAll('[data-since]').forEach(e => {
      const g = (Date.now() - new Date(e.dataset.since).getTime())/1000;
      const gd = Math.floor(g/86400), gh = Math.floor(g%86400/3600), gm = Math.floor(g%3600/60);
      e.textContent = `${gd}d ${gh}h ${gm}m`;
    });
  };
  tick(); setInterval(tick, 1000);
}
boot();
</script>
</body>
</html>
